<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 3 — Simulador de parcelamento</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main>
        <p><a href="../index.html">← Voltar ao menu</a></p>
        <h1>Atividade 3 — Simulador de parcelamento</h1>
        <p>Simule as opções de pagamento. Parcelas de 7, 8, 9 e 11 vezes não estão disponíveis.</p>
        <form id="formulario">
            <div class="campo"><label for="preco">Preço do produto (R$)</label><input id="preco" type="number"
                    min="0.01" step="0.01" required></div>
            <div class="campo"><label for="entrada">Entrada (R$) — opcional</label><input id="entrada" type="number"
                    min="0" step="0.01" placeholder="Deixe vazio se não houver entrada"></div>
            <button type="submit">Simular parcelamento</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Parcelas</th>
                    <th>Valor da parcela</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="parcelas"></tbody>
        </table>
        <div id="resultado" class="resultado" aria-live="polite">Preencha os campos e clique em calcular.</div>
    </main>
    <script type="module" src="ex03.js"></script>
</body>
</html>
