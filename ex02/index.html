<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 2 — Conta de energia</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main>
        <p><a href="../index.html">← Voltar ao menu</a></p>
        <h1>Atividade 2 — Conta de energia</h1>
        <p>Calcule o valor da energia conforme o tipo de cliente e a bandeira tarifária.</p>
        <form id="formulario">
            <div class="campo"><label for="consumo">Consumo (kWh)</label><input id="consumo" type="number" min="0.01"
                    step="0.01" required></div>
            <div class="campo"><label for="cliente">Tipo de cliente</label><select id="cliente">
                    <option value="residencial">Residencial</option>
                    <option value="rural">Rural</option>
                    <option value="comercial">Comercial</option>
                    <option value="industrial">Industrial</option>
                </select></div>
            <div class="campo"><label for="bandeira">Bandeira</label><select id="bandeira">
                    <option value="verde">Verde</option>
                    <option value="amarela">Amarela</option>
                    <option value="vermelha1">Vermelha 1</option>
                    <option value="vermelha2">Vermelha 2</option>
                </select></div>
            <button type="submit">Calcular conta</button>
        </form>
        <div id="resultado" class="resultado" aria-live="polite">Preencha os campos e clique em calcular.</div>
    </main>
    <script type="module" src="ex02.js"></script>
</body>

</html>
