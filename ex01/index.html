<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 1 — Situação do aluno</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main>
        <p><a href="../index.html">← Voltar ao menu</a></p>
        <h1>Atividade 1 — Situação do aluno</h1>
        <p>Informe as notas e a frequência para verificar a situação do estudante.</p>
        <form id="formulario">
            <div class="campo"><label for="nome">Nome do aluno</label><input id="nome" required></div>
            <div class="campo"><label for="n1">Nota 1 (0 a 10)</label><input id="n1" type="number" min="0" max="10"
                    step="0.1" required></div>
            <div class="campo"><label for="n2">Nota 2 (0 a 10)</label><input id="n2" type="number" min="0" max="10"
                    step="0.1" required></div>
            <div class="campo"><label for="frequencia">Frequência (0 a 100%)</label><input id="frequencia" type="number"
                    min="0" max="100" step="0.1" required></div>
            <button type="submit">Verificar situação</button>
        </form>
        <div id="resultado" class="resultado" aria-live="polite">Preencha os campos e clique em calcular.</div>
    </main>
    <script type="module" src="ex01.js"></script>
</body>

</html>
